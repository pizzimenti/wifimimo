# wifimimo: ARP when several adapters hold addresses on one subnet ("ARP flux").
#
# Installed by wifimimo's install.sh as /etc/sysctl.d/99-wifimimo-arp-flux.conf
# and removed by `install.sh --uninstall`; change the copy in the repo.
#
# Two Wi-Fi radios on one network (what multipath sets up), or a radio and a
# wired port on the same LAN, put two addresses from one subnet on one host. By
# default Linux answers ARP for *any* local address on *any* interface, so a
# request arriving on one adapter can be answered for another adapter's address,
# and replies can leave an interface the request never arrived on.
#
# arp_ignore=1     answer only for addresses configured on the interface the
#                  request arrived on.
# arp_announce=2   when sending an ARP request, source it from the address most
#                  appropriate for the target subnet.
#
# Both are the standard fix for a host with two NICs on one segment. They are set
# on "all", which covers every interface, present and future, at all times (the
# kernel uses the larger of "all" and the interface's own value).
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
